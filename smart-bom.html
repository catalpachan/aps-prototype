<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能BOM - 格力高级计划排程系统</title>
  <link rel="stylesheet" href="common.css" />
  <script src="embed-mode.js"></script>
  <style>
    html.is-embedded .aps-header-layout { display: none; }
    html.is-embedded #app { padding: 0; }
    html.is-embedded .module-frame { border: 0; border-radius: 0; box-shadow: none; }

    .bom-page {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .module-frame {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.95);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.22);
    }

    .module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .module-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .module-title strong {
      font-size: 16px;
      color: #f8fafc;
    }

    .module-title span {
      color: #94a3b8;
      font-size: 12px;
      white-space: nowrap;
    }

    .module-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .module-tabs {
      display: inline-flex;
      align-items: center;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      overflow: hidden;
    }

    .tab-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: #94a3b8;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
    }

    .tab-btn + .tab-btn {
      border-left: 1px solid #334155;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    .bom-stage {
      --bom-panel-height: min(720px, calc(100vh - 170px));
      --tree-window-height: 520px;
      display: grid;
      grid-template-columns: minmax(340px, 0.36fr) minmax(0, 1fr);
      align-items: start;
      gap: 14px;
      padding: 14px;
      min-height: calc(100vh - 150px);
    }

    .bom-panel {
      border: 1px solid #334155;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 27, 45, 0.94));
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: var(--bom-panel-height);
    }

    .bom-panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #e2e8f0;
    }

    .bom-panel-head small {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
    }

    .filter-strip {
      margin: 12px 14px 8px;
      padding: 12px;
      border: 1px solid #2f3d55;
      border-radius: 10px;
      background: #10192b;
      display: grid;
      grid-template-columns: var(--filter-template, minmax(0, 1fr) auto);
      gap: 10px;
      align-items: end;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
    }

    .filter-field input,
    .filter-field select {
      width: 100%;
      height: 36px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0 10px;
      font-size: 12px;
    }

    .filter-field input::placeholder {
      color: #64748b;
    }

    .root-list {
      padding: 10px 14px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      min-height: 0;
      flex: 1 1 auto;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }

    .root-list::-webkit-scrollbar,
    .tree-scroll::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .root-list::-webkit-scrollbar-thumb,
    .tree-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #475569;
    }

    .root-list::-webkit-scrollbar-track,
    .tree-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .root-row {
      width: 100%;
      appearance: none;
      border: 1px solid #2f3d55;
      border-radius: 10px;
      background: #10192b;
      color: #cbd5e1;
      display: grid;
      grid-template-columns: minmax(110px, auto) 12px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      text-align: left;
      cursor: pointer;
      transition: transform var(--dur-fast), border-color var(--dur-fast), background var(--dur-fast);
    }

    .root-row:hover,
    .root-row.active {
      border-color: #60a5fa;
      background: #13223d;
      transform: translateY(-1px);
    }

    .bom-code-pill,
    .node-pill,
    .node-meta-pill {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      border: 1px solid #334155;
      border-radius: 999px;
      background: #15233a;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      white-space: nowrap;
    }

    .root-dash {
      color: #64748b;
      font-weight: 800;
    }

    .root-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .bom-pager {
      margin: auto 14px 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #10192b;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 800;
    }

    .detail-tools {
      margin: 12px 14px;
      padding: 12px;
      border: 1px solid #2f3d55;
      border-radius: 10px;
      background: #10192b;
      display: grid;
      grid-template-columns: auto auto minmax(160px, 260px) auto 1fr;
      gap: 10px;
      align-items: end;
    }

    .detail-tools .filter-field {
      max-width: 260px;
    }

    .tree-scroll {
      margin: 0 14px 14px;
      padding: 8px 8px 10px 2px;
      height: var(--tree-window-height);
      overflow-y: auto;
      overflow-x: auto;
      min-height: 0;
      flex: 0 0 var(--tree-window-height);
      border: 1px solid #1b2f48;
      border-radius: 10px;
      background: rgb(13 21 37 / 96%);
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
      transition: transform var(--dur-fast) var(--ease-soft), background var(--dur-fast) var(--ease-soft);
    }

    .tree-scroll:hover {
      transform: translateY(-1px);
      background: rgb(13 21 37 / 96%);
    }

    .tree-node-wrap {
      position: relative;
      padding-left: calc(var(--level) * 42px);
      margin: 8px 0;
    }

    .tree-node-wrap::before {
      content: "";
      position: absolute;
      left: calc(var(--level) * 42px + 14px);
      top: -8px;
      bottom: -8px;
      border-left: 2px solid rgba(96, 165, 250, 0.28);
      opacity: calc(var(--level) * 0.32);
    }

    .tree-node {
      position: relative;
      border: 1px solid #2f3d55;
      border-left: 5px solid var(--node-accent, #f97316);
      border-radius: 12px;
      background: rgba(16, 25, 43, 0.96);
      min-height: 62px;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      box-shadow: 0 8px 16px rgba(2, 6, 23, 0.16);
      transition: transform var(--dur-fast) var(--ease-soft);
    }

    .tree-scroll:hover .tree-node:hover {
      transform: translateX(2px);
    }

    .tree-node.selected {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.14);
    }

    .node-topline {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .node-expander {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #13223d;
      color: #7dd3fc;
      font-weight: 900;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .node-name {
      min-width: 0;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-left: 36px;
    }

    .node-meta-pill {
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.72);
    }

    .node-meta-pill strong {
      color: #7dd3fc;
      margin-right: 4px;
    }

    .node-meta-pill.warn strong {
      color: #fdba74;
    }

    .empty-state {
      border: 1px dashed #334155;
      border-radius: 10px;
      padding: 18px;
      color: #94a3b8;
      text-align: center;
    }

    [data-theme="light"] .module-frame,
    [data-theme="light"] .bom-panel,
    [data-theme="light"] .filter-strip,
    [data-theme="light"] .detail-tools,
    [data-theme="light"] .tree-scroll,
    [data-theme="light"] .bom-pager,
    [data-theme="light"] .root-row,
    [data-theme="light"] .tree-node {
      background: #fff !important;
      background-image: none !important;
      border-color: var(--line) !important;
      color: var(--txt) !important;
      box-shadow: 0 10px 28px rgb(15 23 42 / 0.08);
    }

    [data-theme="light"] .module-header,
    [data-theme="light"] .bom-panel-head {
      border-color: var(--line) !important;
    }

    [data-theme="light"] .module-title strong,
    [data-theme="light"] .bom-panel-head,
    [data-theme="light"] .root-name,
    [data-theme="light"] .node-name {
      color: var(--txt) !important;
    }

    [data-theme="light"] .module-title span,
    [data-theme="light"] .bom-panel-head small,
    [data-theme="light"] .filter-field,
    [data-theme="light"] .bom-pager,
    [data-theme="light"] .empty-state {
      color: var(--muted) !important;
    }

    [data-theme="light"] .module-tabs,
    [data-theme="light"] .filter-field input,
    [data-theme="light"] .filter-field select,
    [data-theme="light"] .bom-code-pill,
    [data-theme="light"] .node-pill,
    [data-theme="light"] .node-meta-pill,
    [data-theme="light"] .node-expander {
      background: var(--panel-2) !important;
      color: var(--txt) !important;
      border-color: var(--line) !important;
    }

    [data-theme="light"] .tab-btn.active {
      background: #2563eb !important;
      color: #fff !important;
    }

    @media (max-width: 1100px) {
      .bom-stage {
        grid-template-columns: 1fr;
        --bom-panel-height: 620px;
        --tree-window-height: 420px;
      }

      .bom-panel {
        min-height: 0;
      }
    }

    @media (max-width: 760px) {
      .aps-header-layout {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .aps-header-layout .brand-block {
        min-width: 0;
      }

      .aps-header-layout .nav.aps-main-nav {
        grid-column: auto;
        justify-self: stretch;
        justify-content: flex-start;
      }

      .aps-header-layout .aps-header-meta {
        justify-self: stretch;
        flex-wrap: wrap;
        white-space: normal;
      }

      .aps-site-switch {
        margin-left: 0;
      }

      .bom-stage {
        padding: 10px;
        --bom-panel-height: 560px;
        --tree-window-height: 360px;
      }

      .filter-strip,
      .detail-tools {
        grid-template-columns: 1fr;
      }

      .root-row {
        grid-template-columns: minmax(0, 1fr);
      }

      .root-dash,
      .root-name {
        display: none;
      }

      .tree-node-wrap {
        padding-left: calc(var(--level) * 20px);
      }

      .tree-node-wrap::before {
        left: calc(var(--level) * 20px + 10px);
      }
    }
  </style>
</head>

  <header class="aps-header-layout">
    <div class="brand-block">

  </header>

  <main id="app">
    <section class="view bom-page">
      <div class="module-frame">
        <div class="module-header">
          <div class="module-title">
            <strong>智能BOM</strong>
            <span id="bom-title-suffix">全局BOM</span>
          </div>
          <div class="module-actions">
            <div class="module-tabs" aria-label="智能BOM页签">
              <button class="tab-btn active" type="button" data-bom-tab="global">全局BOM</button>
              <button class="tab-btn" type="button" data-bom-tab="split">BOM拆解</button>
            </div>
            <a href="collab.html" target="_top" class="btn sm module-return-link">返回排产操作</a>

        </div>

        <div class="bom-stage">
          <section class="bom-panel" aria-labelledby="bom-root-heading">
            <div class="bom-panel-head">

              <small id="bom-root-count">0 条</small>

            <div class="filter-strip" id="bom-root-filters">

              <span id="bom-detail-heading">节点详情</span>
              <small id="bom-selected-root">未选择</small>

            <div class="detail-tools">

              </label>
              <button class="btn" type="button" id="bom-depth-apply">应用</button>
            </div>
            <div class="tree-scroll" id="bom-detail-tree"></div>
          </section>
        </div>
      </div>
    </section>
  </main>

    const bomState = {
      tab: 'global',
      selectedCode: 'CA341N03400_X95953',
      maxDepth: 6,
      collapsed: new Set()
    };

    function text(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function activeDataset() {
      return bomCatalog[bomState.tab];
    }

    function findRoot(code) {
      return activeDataset().roots.find((root) => root.code === code) || activeDataset().roots[0];
    }

    function clampDepth(value) {
      const parsed = Number.parseInt(value, 10);
      if (Number.isNaN(parsed)) return activeDataset().depth;
      return Math.min(6, Math.max(1, parsed));
    }

    function ensureChildren(root) {
      if (root.children && root.children.length) return root;
      return {
        ...root,
        children: [
          {
            code: '000001000062H03',
            name: '底壳部件',
            qty: '1.0000000000 套',
            demand: '1 套',
            source: 'NULL',

          airflowAssemblyBranch,
          heatExchangeBranch,
          controllerAssemblyBranch

        `;
      }
      document.getElementById('bom-search-btn')?.addEventListener('click', applyRootSearch);
      document.getElementById('bom-search-input')?.addEventListener('input', applyRootSearch);
    }

    function applyRootSearch() {
      renderRootList();
    }

    function getFilteredRoots() {
      const keyword = document.getElementById('bom-search-input')?.value.trim().toLowerCase() || '';
      return activeDataset().roots.filter((root) => {
        if (!keyword) return true;
        return `${root.code} ${root.name}`.toLowerCase().includes(keyword);
      });
    }

    function renderRootList() {
      const list = document.getElementById('bom-root-list');
      const count = document.getElementById('bom-root-count');
      if (!list) return;
      const roots = getFilteredRoots();
      if (count) count.textContent = `${roots.length} 条`;
      if (!roots.length) {
        list.innerHTML = '<div class="empty-state">暂无匹配成品码</div>';
        return;
      }
      list.innerHTML = roots.map((root) => `
        <button class="root-row ${root.code === bomState.selectedCode ? 'active' : ''}" type="button" data-root="${text(root.code)}">
          <span class="bom-code-pill">${text(root.code)}</span>
          <span class="root-dash">-</span>
          <span class="root-name">${text(root.name)}</span>
        </button>
      `).join('');
      list.querySelectorAll('.root-row').forEach((button) => {
        button.addEventListener('click', () => {
          bomState.selectedCode = button.dataset.root;
          renderRootList();
          renderDetailTree();
        });
      });
    }

    function renderNode(node, level = 0, isRoot = false) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const canShowChildren = hasChildren && level < bomState.maxDepth - 1;
      const collapsed = bomState.collapsed.has(node.code);
      const expandedSymbol = canShowChildren && !collapsed ? '▼' : '▶';
      const childHtml = canShowChildren && !collapsed ? node.children.map((child) => renderNode(child, level + 1)).join('') : '';
      return `
        <div class="tree-node-wrap" style="--level:${level};">
          <div class="tree-node ${isRoot ? 'selected' : ''}" style="--node-accent:${text(node.accent || '#ef4444')}">
            <div class="node-topline">
              <button class="node-expander" type="button" data-node-toggle="${text(node.code)}" ${canShowChildren ? '' : 'disabled'}>${expandedSymbol}</button>
              <span class="node-pill">${text(node.code)}</span>
              <span class="node-name">${text(node.name)}</span>
            </div>
            ${isRoot ? '' : `
              <div class="node-meta-row">
                <span class="node-meta-pill"><strong>数量</strong>${text(node.qty || '1.0000000000 套')}</span>
                <span class="node-meta-pill"><strong>需求量</strong>${text(node.demand || '1 套')}</span>
                <span class="node-meta-pill"><strong>来源</strong>${text(node.source || 'NULL')}</span>
                <span class="node-meta-pill warn"><strong>类型</strong>${text(node.type || '制作车间（制造物料）')}</span>
                <span class="node-meta-pill"><strong>虚拟件</strong>${text(node.virtual || '否')}</span>
              </div>
            `}
          </div>
        </div>
        ${childHtml}
      `;
    }

    function renderDetailTree() {
      const tree = document.getElementById('bom-detail-tree');
      const selected = document.getElementById('bom-selected-root');
      const depthInput = document.getElementById('bom-depth-input');
      if (!tree) return;
      const root = ensureChildren(findRoot(bomState.selectedCode));
      if (selected) selected.textContent = root.code;
      if (depthInput) depthInput.value = bomState.maxDepth;
      tree.innerHTML = renderNode(root, 0, true);
      tree.querySelectorAll('[data-node-toggle]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const code = button.dataset.nodeToggle;
          if (!code) return;
          if (bomState.collapsed.has(code)) {
            bomState.collapsed.delete(code);
          } else {
            bomState.collapsed.add(code);
          }
          renderDetailTree();
        });
      });
    }

    function switchTab(tab) {
      bomState.tab = tab;
      bomState.collapsed.clear();
      bomState.selectedCode = activeDataset().roots[0].code;
      bomState.maxDepth = activeDataset().depth;
      document.querySelectorAll('[data-bom-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.bomTab === tab);
      });
      document.getElementById('bom-title-suffix').textContent = activeDataset().label;
      document.getElementById('bom-page-info').textContent = activeDataset().pageInfo;
      renderFilters();
      renderRootList();
      renderDetailTree();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-bom-tab]').forEach((button) => {
        button.addEventListener('click', () => switchTab(button.dataset.bomTab));
      });
      document.getElementById('bom-expand-all')?.addEventListener('click', () => {
        bomState.collapsed.clear();
        renderDetailTree();
      });
      document.getElementById('bom-collapse-all')?.addEventListener('click', () => {
        const collect = (node) => {
          if (node.children?.length) {
            bomState.collapsed.add(node.code);
            node.children.forEach(collect);
          }
        };
        collect(ensureChildren(findRoot(bomState.selectedCode)));
        renderDetailTree();
      });
      document.getElementById('bom-depth-apply')?.addEventListener('click', () => {
        const input = document.getElementById('bom-depth-input');
        bomState.maxDepth = clampDepth(input?.value);
        renderDetailTree();
        toast(`层级已应用：最多显示 ${bomState.maxDepth} 层`);
      });
      const initialTab = new URLSearchParams(window.location.search).get('tab');
      switchTab(['global', 'split'].includes(initialTab) ? initialTab : 'global');
    });
