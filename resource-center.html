<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资源管理中心 - 格力高级计划排程系统</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    .resource-center-page { min-height: calc(100vh - 96px); }
    .resource-center-shell {
      min-height: calc(100vh - 96px);
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #0d1525;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.28);
    }
    .resource-center-sidebar {
      padding: 16px 12px;
      border-right: 1px solid #2c3a51;
      background: #10192b;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    .resource-center-brand {
      padding: 0 8px 14px;
      border-bottom: 1px solid #2c3a51;
      display: grid;
      gap: 4px;
    }
    .resource-center-brand strong { color: #f8fafc; font-size: 16px; }
    .resource-center-brand span { color: #7f91ad; font-size: 11px; line-height: 1.5; }
    .resource-center-nav {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding-right: 2px;
    }
    .resource-center-factory {
      display: grid;
      gap: 6px;
    }
    .resource-center-nav-btn,
    .resource-center-area-btn,
    .resource-center-leaf-btn {
      width: 100%;
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #aebdd2;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      padding: 0 12px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
    }
    .resource-center-nav-btn {
      min-height: 40px;
    }
    .resource-center-nav-btn:hover,
    .resource-center-area-btn:hover,
    .resource-center-leaf-btn:hover {
      color: #fff;
      border-color: #3b4d68;
      background: #17243a;
      transform: translateX(2px);
    }
    .resource-center-nav-btn.active {
      color: #fff;
      border-color: #2f68d8;
      background: #1d4ed8;
    }
    .resource-center-area {
      display: none;
      gap: 5px;
      padding-left: 8px;
    }
    .resource-center-factory.active .resource-center-area {
      display: grid;
    }
    .resource-center-area-btn {
      min-height: 32px;
      color: #8ea1be;
      font-size: 12px;
      padding-left: 14px;
    }
    .resource-center-area-btn.active {
      color: #eaf2ff;
      background: #17243a;
      border-color: #334a69;
    }
    .resource-center-leaf-list {
      display: none;
      gap: 5px;
      padding-left: 10px;
    }
    .resource-center-area.active .resource-center-leaf-list {
      display: grid;
    }
    .resource-center-leaf-btn {
      min-height: 30px;
      color: #7f91ad;
      font-size: 12px;
      padding-left: 16px;
    }
    .resource-center-leaf-btn.active {
      color: #fff;
      border-color: #2f68d8;
      background: #1d4ed8;
    }
    .resource-center-workspace {
      min-width: 0;
      background: #0b1321;
    }
    .resource-center-content {
      min-width: 0;
      min-height: 720px;
      background: #0d1525;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
    }
    .resource-workspace-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 2px 2px 12px;
      border-bottom: 1px solid #2c3a51;
    }
    .resource-title-block {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .resource-title-block h1 {
      margin: 0;
      color: #f8fafc;
      font-size: 22px;
      line-height: 1.25;
    }
    .resource-title-block p {
      margin: 0;
      color: #7f91ad;
      font-size: 12px;
      line-height: 1.6;
    }
    .resource-toolbar-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid #2c3a51;
      border-radius: 10px;
      background: #10192b;
    }
    .resource-search-wrap {
      width: min(460px, 100%);
      display: block;
    }
    .resource-search-wrap input {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1321;
      color: #e2e8f0;
      padding: 0 12px;
      font: inherit;
      font-size: 12px;
      outline: none;
    }
    .resource-search-wrap input:focus {
      border-color: #2f68d8;
      box-shadow: 0 0 0 3px rgb(37 99 235 / 18%);
    }
    .resource-context-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      color: #b7c8e3;
      background: #17243a;
      border: 1px solid #334a69;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .resource-data-card {
      min-width: 0;
      border: 1px solid #2c3a51;
      border-radius: 10px;
      background: #10192b;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .resource-table-wrap {
      min-width: 0;
      overflow: auto;
    }
    .resource-master-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      color: #dbe7f6;
      table-layout: fixed;
    }
    .resource-master-table th,
    .resource-master-table td {
      border-bottom: 1px solid #23334b;
      padding: 12px 14px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }
    .resource-master-table th {
      color: #f8fafc;
      background: #17243a;
      font-weight: 800;
    }
    .resource-master-table td {
      color: #cbd7e8;
    }
    .resource-master-table tbody tr:hover td {
      background: #132037;
      color: #fff;
    }
    .resource-status {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: #bfdbfe;
      background: rgb(37 99 235 / 16%);
      border: 1px solid rgb(59 130 246 / 32%);
    }
    .resource-status.warn {
      color: #fde68a;
      background: rgb(245 158 11 / 14%);
      border-color: rgb(245 158 11 / 32%);
    }
    .resource-status.ok {
      color: #bbf7d0;
      background: rgb(34 197 94 / 13%);
      border-color: rgb(34 197 94 / 30%);
    }
    .resource-center-pager {
      min-height: 48px;
      padding: 0 12px;
      border-top: 1px solid #2c3a51;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: #7f91ad;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .resource-center-pager button,
    .resource-center-pager input {
      height: 28px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0b1321;
      color: #cbd7e8;
      font: inherit;
      font-size: 12px;
    }
    .resource-center-pager button {
      min-width: 30px;
      cursor: pointer;
      padding: 0 10px;
    }
    .resource-center-pager button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .resource-center-pager input {
      width: 64px;
      text-align: center;
    }
    [data-theme="light"] .resource-center-shell,
    [data-theme="light"] .resource-center-workspace,
    [data-theme="light"] .resource-center-content,
    [data-theme="light"] .resource-toolbar-card,
    [data-theme="light"] .resource-data-card { background: #f4f7fb; }
    [data-theme="light"] .resource-center-sidebar { background: #fff; border-color: var(--line); }
    [data-theme="light"] .resource-center-brand { border-color: var(--line); }
    [data-theme="light"] .resource-center-brand strong,
    [data-theme="light"] .resource-title-block h1 { color: var(--txt); }
    [data-theme="light"] .resource-center-brand span,
    [data-theme="light"] .resource-title-block p { color: var(--muted); }
    [data-theme="light"] .resource-center-nav-btn,
    [data-theme="light"] .resource-center-area-btn,
    [data-theme="light"] .resource-center-leaf-btn { color: #52647d; }
    [data-theme="light"] .resource-center-nav-btn.active,
    [data-theme="light"] .resource-center-leaf-btn.active { color: #fff; background: #2563eb; }
    @media (max-width: 900px) {
      #app { padding: 10px; }
      .resource-center-shell { grid-template-columns: 1fr; }
      .resource-center-sidebar {
        padding: 10px;
        border-right: 0;
        border-bottom: 1px solid #2c3a51;
        gap: 10px;
      }
      .resource-center-brand { padding: 0 2px 8px; }
      .resource-center-nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .resource-center-factory {
        min-width: 176px;
      }
      .resource-center-content { min-height: 680px; padding: 12px; }
      .resource-workspace-head,
      .resource-toolbar-card {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>

        names: ['核心品目主数据', '新品试制品目池'],
        status: ['启用', '启用'],
        capacity: (factory, index) => `${factory.capacity + index * 36} ${factory.unit}`
      },
      resource: {
        code: 'RES',
        names: ['主线资源能力组', '瓶颈工序资源池'],
        status: ['启用', '检修'],
        capacity: (factory, index) => `${Math.round(factory.capacity * (0.46 + index * 0.08))} ${factory.unit}`
      },
      bom: {
        code: 'BOM',
        names: ['标准制造BOM基线', '柔性替代BOM方案'],
        status: ['启用', '维护中'],
        capacity: (factory, index) => `${factory.capacity + 180 + index * 48} 件`
      },
      leadtime: {
        code: 'LT',
        names: ['配套提前期规则', '跨厂齐套缓冲策略'],
        status: ['启用', '启用'],
        capacity: (_factory, index) => `${index + 2} 天`
      },
      order: {
        code: 'PO',
        names: ['本周生产订单池', '急单插单队列'],
        status: ['启用', '维护中'],
        capacity: (factory, index) => `${Math.round(factory.capacity * (1.7 + index * 0.35))} 单`
      },
      attendance: {
        code: 'AT',
        names: ['早晚班出勤模式', '旺季加班模式'],
        status: ['启用', '启用'],
        capacity: (factory, index) => `${Math.round(factory.capacity / (3.5 - index * 0.4))} 人`
      },
      calendar: {
        code: 'CAL',
        names: ['标准工作日历', '周日检修日历'],
        status: ['启用', '维护中'],
        capacity: (_factory, index) => `${26 - index * 4} 天`
      }
    };
    const resourceRows = Object.entries(factoryProfiles).flatMap(([factoryKey, factory], factoryIndex) => {
      return Object.entries(tableProfiles).flatMap(([tableKey, table], tableIndex) => {
        return table.names.map((name, nameIndex) => {
          const sequence = factoryIndex * 100 + tableIndex * 10 + nameIndex + 1;
          const owner = factory.owners[(tableIndex + nameIndex) % factory.owners.length];
          return [
            String(sequence),
            `${factory.prefix}-${table.code}-${String(sequence).padStart(3, '0')}`,
            `${factory.label}${name}`,
            factory.label,
            tableLabels[tableKey],
            table.status[nameIndex],
            table.capacity(factory, nameIndex),
            owner
          ];
        });
      });
    });
    const PAGE_SIZE = 8;
    let currentFactory = 'assembly';
    let currentArea = 'equipment';
    let currentTable = 'item';
    let currentPage = 1;

    function currentLabelSet() {
      return {
        factory: factoryLabels[currentFactory] || '总装',
        area: areaLabels[currentArea] || '设备管理',
        table: tableLabels[currentTable] || '品目表'
      };
    }

    function filteredRows() {
      const labels = currentLabelSet();
      const query = document.getElementById('resource-search')?.value.trim().toLowerCase() || '';
      return resourceRows.filter((row) => {
        const matchesContext = row[3] === labels.factory && row[4] === labels.table;
        const matchesQuery = row.join(' ').toLowerCase().includes(query);
        return matchesContext && matchesQuery;
      });
    }

    function renderResourceRows() {
      const tbody = document.getElementById('resource-master-tbody');
      const total = document.getElementById('resource-total');
      const pageInfo = document.getElementById('resource-page-info');
      const prevBtn = document.getElementById('resource-prev-page');
      const nextBtn = document.getElementById('resource-next-page');
      if (!tbody) return;

      const rows = filteredRows();
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      currentPage = Math.min(Math.max(currentPage, 1), totalPages);
      const pageRows = rows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
      tbody.innerHTML = pageRows.length
        ? pageRows.map((row) => `
          <tr>
            <td>${row[0]}</td>
            <td title="${row[1]}">${row[1]}</td>
            <td title="${row[2]}">${row[2]}</td>
            <td>${row[3]}</td>
            <td>${row[4]}</td>
            <td><span class="resource-status ${row[5] === '检修' || row[5] === '维护中' ? 'warn' : 'ok'}">${row[5]}</span></td>
            <td>${row[6]}</td>
            <td>${row[7]}</td>
          </tr>
        `).join('')
        : '<tr><td colspan="8">当前分厂和表单暂无匹配数据</td></tr>';
      if (total) total.textContent = `共 ${rows.length} 条`;
      if (pageInfo) pageInfo.textContent = `${currentPage} / ${totalPages}`;
      if (prevBtn) prevBtn.disabled = currentPage <= 1;
      if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
    }

    function syncNavState() {
      document.querySelectorAll('.resource-center-factory').forEach((factory) => {
        const factoryActive = factory.dataset.factory === currentFactory;
        factory.classList.toggle('active', factoryActive);
        factory.querySelector('.resource-center-nav-btn')?.classList.toggle('active', factoryActive);
        factory.querySelectorAll('.resource-center-area').forEach((area) => {
          const areaButton = area.querySelector('[data-resource-area]');
          const areaActive = factoryActive && areaButton?.dataset.resourceArea === currentArea;
          area.classList.toggle('active', areaActive);
          areaButton?.classList.toggle('active', areaActive);
          area.querySelectorAll('[data-resource-table]').forEach((leaf) => {
            leaf.classList.toggle('active', areaActive && leaf.dataset.resourceTable === currentTable);
          });
        });
      });
      const labels = currentLabelSet();
      const title = document.getElementById('resource-table-title');
      const desc = document.getElementById('resource-table-desc');
      const chip = document.getElementById('resource-context-chip');
      if (title) title.textContent = labels.table;
      if (desc) desc.textContent = `${labels.factory} · ${labels.area} · ${labels.table}，维护资源主数据、产能口径和执行状态。`;
      if (chip) chip.textContent = `${labels.factory} / ${labels.area} / ${labels.table}`;
    }

    function selectResourceContext(options = {}) {
      if (options.factory) currentFactory = options.factory;
      if (options.area) currentArea = options.area;
      if (options.table) currentTable = options.table;
      if (currentArea === 'labor' && !['attendance', 'calendar'].includes(currentTable)) currentTable = 'attendance';
      if (currentArea === 'equipment' && ['attendance', 'calendar'].includes(currentTable)) currentTable = 'item';
      currentPage = 1;
      syncNavState();
      renderResourceRows();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-factory-nav]').forEach((button) => {
        button.addEventListener('click', () => selectResourceContext({ factory: button.dataset.factoryNav, area: 'equipment', table: 'item' }));
      });
      document.querySelectorAll('[data-resource-area]').forEach((button) => {
        button.addEventListener('click', () => {
          const factory = button.closest('.resource-center-factory')?.dataset.factory;
          const area = button.dataset.resourceArea;
          selectResourceContext({ factory, area, table: area === 'labor' ? 'attendance' : 'item' });
        });
      });
      document.querySelectorAll('[data-resource-table]').forEach((button) => {
        button.addEventListener('click', () => {
          const factory = button.closest('.resource-center-factory')?.dataset.factory;
          const area = button.closest('.resource-center-area')?.querySelector('[data-resource-area]')?.dataset.resourceArea;
          selectResourceContext({ factory, area, table: button.dataset.resourceTable });
        });
      });
      document.getElementById('resource-search')?.addEventListener('input', () => {
        currentPage = 1;
        renderResourceRows();
      });
      document.getElementById('resource-prev-page')?.addEventListener('click', () => {
        currentPage -= 1;
        renderResourceRows();
      });
      document.getElementById('resource-next-page')?.addEventListener('click', () => {
        currentPage += 1;
        renderResourceRows();
      });
      document.getElementById('resource-jump-page')?.addEventListener('click', () => {
        const next = Number(document.getElementById('resource-page-input')?.value || 1);
        currentPage = Number.isFinite(next) ? next : 1;
        renderResourceRows();
      });
      syncNavState();
      renderResourceRows();
    });
  </script>
  <script src="common.js?v=20260611-single-ai-assistant"></script>
</body>
